.brand{font-weight:650;font-size:17px;letter-spacing:-.01em}
.tabs{display:flex;align-items:center;gap:6px}

main{max-width:880px;margin:0 auto;padding:24px 16px 90px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.015em}

.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}

textarea{min-height:100px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}

.seg button:last-child{border:0}.seg button:hover{background:var(--hov)}

.hide{display:none!important}
details summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}

$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('theme',theme);applyUI()};
async function fetchRemoved(){if(!sb||!PASS)return;try{const {data,error}=await sb.rpc('get_vote',{p_poll:POLL,p_pass:PASS,p_name:'__removed__'});if(!error&&data&&Array.isArray(data.removed))removed=data.removed.map(lc)}catch(e){}}
async function setRemoved(fn){if(!sb||!PASS)return{error:{message:'offline'}};
const cur=await sb.rpc('get_vote',{p_poll:POLL,p_pass:PASS,p_name:'__removed__'});
if(isAuthErr(cur.error)){lock(t().gateBad);return{error:cur.error}}
const list=(cur.data&&Array.isArray(cur.data.removed))?cur.data.removed.map(lc):[];
const next=fn(list);
const r=await sb.rpc('submit_vote',{p_poll:POLL,p_pass:PASS,p_name:'__removed__',p_data:{n:'__removed__',v:'',c:[],removed:next}});
if(isAuthErr(r.error)){lock(t().gateBad);return r}
if(!r.error)removed=next;return r}
async function delProposal(n){if(!confirm(t().delConfirm(n)))return;const k=lc(n);
const {error}=await setRemoved(l=>l.includes(k)?l:[...l,k]);if(error){alert(t().delErr+error.message);return}
custom=custom.filter(x=>lc(x)!==k);Object.keys(votes).forEach(kk=>{if(kk.startsWith('x:')&&lc(kk.slice(2))===k)delete votes[kk]});save();render()}
async function fetchShared(){if(!sb||!PASS)return;try{const {data,error}=await sb.rpc('get_proposals',{p_poll:POLL,p_pass:PASS});if(isAuthErr(error)){lock(t().gateBad);return}if(!error&&data){shared=data}await fetchRemoved();render()}catch(e){}}
$('ca').onclick=async()=>{const v=$('cn').value.trim().slice(0,60);if(!v)return;$('cn').value='';
if(sb&&PASS&&removed.includes(lc(v))){await setRemoved(l=>l.filter(x=>x!==lc(v)))}
if(!extras().some(n=>n.toLowerCase()===v.toLowerCase()))custom.push(v);
const real=extras().find(n=>n.toLowerCase()===v.toLowerCase())||v;votes['x:'+real]=0;save();render();
if(sb&&PASS){try{const {error}=await sb.rpc('add_proposal',{p_poll:POLL,p_pass:PASS,p_name:v});if(isAuthErr(error))lock(t().gateBad)}catch(e){}}};
$('name').value=localStorage.getItem('nm')||'';$('name').oninput=e=>localStorage.setItem('nm',e.target.value);
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}
function mkObj(){const v=GAMES.map((g,i)=>votes['g'+i]===undefined?'-':votes['g'+i]).join('');
return {n:$('name').value.trim().slice(0,30)||'Anonyme',v,c:extras().map(n=>[n,votes['x:'+n]===undefined?-1:votes['x:'+n]])}}
$('gen').onclick=async()=>{if(!$('name').value.trim()){alert(t().needName);$('name').focus();return}
const o=mkObj();$('code').value=enc(o);$('done').classList.remove('hide');$('stl').textContent=t().sending;$('done').scrollIntoView({behavior:'smooth'});
if(!sb){$('stl').textContent=t().noServer;return}
try{const {error}=await sb.rpc('submit_vote',{p_poll:POLL,p_pass:PASS,p_name:o.n,p_data:o});
if(isAuthErr(error)){lock(t().gateBad);return}
$('stl').textContent=error?t().sendErr+error.message+' — '+t().noServer:t().sent}catch(e){$('stl').textContent=t().sendErr+e.message}};
$('cpC').onclick=()=>navigator.clipboard.writeText($('code').value);
$('inv').onclick=()=>{navigator.clipboard.writeText(location.origin+location.pathname+'?poll='+encodeURIComponent(POLL)+'#k='+encodeURIComponent(PASS));alert(t().invited)};
$('rst').onclick=()=>{if(confirm(t().confirmReset)){votes={};custom=[];save();render()}};
function loadObj(o){votes={};(o.v||'').split('').forEach((ch,i)=>{if(ch!=='-')votes['g'+i]=+ch});(o.c||[]).forEach(([n,k])=>{if(!extras().some(x=>x.toLowerCase()===n.toLowerCase()))custom.push(n);const real=extras().find(x=>x.toLowerCase()===n.toLowerCase())||n;if(k>=0)votes['x:'+real]=k});
$('name').value=o.n;localStorage.setItem('nm',o.n);save();render()}
$('impB').onclick=()=>{try{loadObj(dec($('imp').value.trim()));alert(t().loaded)}catch(e){alert(t().bad)}};
$('srv').onclick=async()=>{const n=$('name').value.trim();if(!n){alert(t().needName);$('name').focus();return}
if(!sb){alert(t().noServer);return}
const {data,error}=await sb.rpc('get_vote',{p_poll:POLL,p_pass:PASS,p_name:n});
if(isAuthErr(error)){lock(t().gateBad);return}
if(error){alert(t().nofetch+error.message);return}if(!data){alert(t().notFound);return}loadObj(data);alert(t().loaded)};
function show(r){$('vote').classList.toggle('hide',r);$('res').classList.toggle('hide',!r);$('tV').classList.toggle('on',!r);$('tR').classList.toggle('on',r);window.scrollTo(0,0);if(r)loadAll()}
$('tV').onclick=()=>show(false);$('tR').onclick=()=>show(true);
async function loadAll(){if(!sb){$('rst2').textContent=t().noServer;return}
$('rst2').textContent='…';
const {data,error}=await sb.rpc('get_votes',{p_poll:POLL,p_pass:PASS});
if(isAuthErr(error)){lock(t().gateBad);return}
if(error){$('rst2').textContent=t().nofetch+error.message;return}
const rm=(data||[]).find(d=>d&&d.n==='__removed__');if(rm&&Array.isArray(rm.removed))removed=rm.removed.map(lc);
$('codes').value=(data||[]).map(enc).join('\n');calc();$('rst2').textContent=t().updated+new Date().toLocaleTimeString()}
$('refresh').onclick=()=>{fetchShared();loadAll()};
function parse(s){return s.split(/\s+/).filter(Boolean).map(x=>{try{return dec(x)}catch(e){return null}}).filter(x=>x&&x.n&&x.n!=='__removed__')}
function dl(name,mime,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const stamp=()=>new Date().toISOString().slice(0,10);
function expJson(){if(!LAST)return;dl('classement-'+stamp()+'.json','application/json',JSON.stringify({app:'game-night-vote',version:1,exported:new Date().toISOString(),voters:LAST.P,ranking:LAST.R.map((e,i)=>({rank:i+1,game:e.n,score:e.s,hot:e.c[0],ifNeeded:e.c[1],notForMe:e.c[2],suggested:!!e.custom}))},null,2))}
function expCsv(){if(!LAST)return;const q=s=>'"'+String(s).replace(/"/g,'""')+'"',o=t().opts;
const L=[['#',t().game,t().score,o[0],o[1],o[2]].map(q).join(';')];
LAST.R.forEach((e,i)=>L.push([i+1,q(e.n),e.s,e.c[0],e.c[1],e.c[2]].join(';')));
dl('classement-'+stamp()+'.csv','text/csv;charset=utf-8','\ufeff'+L.join('\r\n'))}
$('impF').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='game-night-vote'||!Array.isArray(d.voters)||!d.voters.length)throw 0;
const add=d.voters.map(enc).join('\n'),cur=$('codes').value.trim();$('codes').value=(cur?cur+'\n':'')+add;calc();alert(t().impOk(d.voters.length))}catch(x){alert(t().impBad)}};
r.readAsText(f);e.target.value=''};
function calc(){const D=new Map();parse($('codes').value).forEach(x=>D.set(x.n.toLowerCase(),x));const P=[...D.values()];
if(!P.length){LAST=null;$('out').innerHTML='<div class="panel">'+t().none+'</div>';return}
const m={};const add=n=>{const k=n.toLowerCase();return m[k]=m[k]||{n,s:0,c:[0,0,0],v:0}};
GAMES.forEach(g=>add(g.n));
P.forEach(p=>{(p.v||'').split('').forEach((ch,i)=>{if(ch==='-'||!GAMES[i])return;const e=add(GAMES[i].n),k=+ch;e.c[k]++;e.s+=PTS[k];e.v++});
(p.c||[]).forEach(([n,k])=>{if(removed.includes(lc(n)))return;const e=add(n);e.custom=1;if(k>=0){e.c[k]++;e.s+=PTS[k];e.v++}})});
const R=Object.values(m).filter(e=>e.v>0||e.custom).sort((a,b)=>b.s-a.s||a.c[2]-b.c[2]||b.c[0]-a.c[0]||a.n.localeCompare(b.n));
LAST={P,R};
const max=Math.max(1,...R.map(e=>e.s)),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),o=t().opts;
let h=`<div class="head"><h2>${t().ranking}</h2><span class="row"><button class="btn" id="xj">${t().expJson}</button><button class="btn" id="xc">${t().expCsv}</button></span></div><p class="hint" style="margin:0 0 10px">${esc(t().voters(P.length,P.map(p=>p.n).join(', ')))}</p><table><tr><th>#</th><th>${t().game}</th><th>${t().score}</th><th class="n">${o[0]}</th><th class="n">${o[1]}</th><th class="n">${o[2]}</th></tr>`;
R.forEach((e,i)=>{h+=`<tr class="${i<3?'top3':''}"><td class="pos">${i+1}</td><td>${esc(e.n)}${e.custom?'<span class="tag">'+t().proposed+'</span>':''}</td><td><div class="sc"><span><i style="width:${Math.max(0,e.s)/max*100}%"></i></span>${e.s}</div></td><td class="n">${e.c[0]}</td><td class="n">${e.c[1]}</td><td class="n">${e.c[2]}</td></tr>`});
$('out').innerHTML=h+'</table>';$('xj').onclick=expJson;$('xc').onclick=expCsv}
$('calc').onclick=calc;
async function tryPass(p){if(!sb){return true}
const {error}=await sb.rpc('get_proposals',{p_poll:POLL,p_pass:p});
if(!error)return true;if(isAuthErr(error))return false;throw error}
async function unlock(p,fromUser){
try{if(await tryPass(p)){PASS=p;localStorage.setItem('pass:'+POLL,p);$('gate').classList.add('hide');$('pwE').classList.add('hide');$('pw').value='';fetchShared();return}
if(fromUser||true){$('pwE').textContent=t().gateBad;$('pwE').classList.remove('hide')}localStorage.removeItem('pass:'+POLL);$('gate').classList.remove('hide')}
catch(e){$('pwE').textContent=t().gateErr+(e.message||e);$('pwE').classList.remove('hide');$('gate').classList.remove('hide')}}
$('pwB').onclick=()=>{const p=$('pw').value;if(p)unlock(p,true)};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('pwB').click()};
applyUI();
(function init(){
const m=location.hash.match(/[#&]k=([^&]*)/);let p=m?decodeURIComponent(m[1]):'';
if(m)history.replaceState(null,'',location.pathname+location.search);
p=p||localStorage.getItem('pass:'+POLL)||'';
if(!sb){return}
if(p)unlock(p,false);else $('gate').classList.remove('hide')})();
</script></body></html>
